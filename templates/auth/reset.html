{% extends "base.html" %}

{% block title %}Set New Password - HackSphere{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Set New Password</h1>
      <p>Enter your new password below.</p>
    </div>

    <form method="POST" action="{{ url_for('auth_reset_password', token=token) }}">
      <div class="form-group">
        <label for="newPassword" class="form-label">New Password</label>
        <div class="password-input-group">
          <input type="password" id="newPassword" name="password" class="form-control" placeholder="At least 8 chars with letters & numbers" required autocomplete="new-password">
          <button type="button" class="password-toggle-btn" data-target="newPassword" aria-label="Toggle password visibility">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
        <div class="password-input-group">
          <input type="password" id="confirmNewPassword" name="confirm_password" class="form-control" placeholder="Re-type your new password" required autocomplete="new-password">
          <button type="button" class="password-toggle-btn" data-target="confirmNewPassword" aria-label="Toggle password visibility">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
        Update Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
